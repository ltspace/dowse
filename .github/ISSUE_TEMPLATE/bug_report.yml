name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: dowse version
      description: The installed release version, or the commit if you built dowse yourself
      placeholder: v1.0.0 / commit abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      description: e.g. Windows 11 23H2, Windows 10 22H2
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened instead of what you expected?
      placeholder: |
        1. Open dowse with the global shortcut
        2. Search for ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect dowse to do?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots (optional)
      description: Attach screenshots or the relevant part of `%LOCALAPPDATA%\dowse\data\logs\dowse.log`. Please remove private file names and paths first.
    validations:
      required: false
